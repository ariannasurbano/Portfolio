<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Python-inspired programming language illustration</title>
  <desc id="desc">A Python-style badge with glowing code accents.</desc>
  <defs>
    <linearGradient id="pythonBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6f8bff"/>
      <stop offset="100%" stop-color="#3d56d9"/>
    </linearGradient>
    <linearGradient id="pythonGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd86f"/>
      <stop offset="100%" stop-color="#ffb400"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="28" fill="none"/>
  <circle cx="128" cy="128" r="96" fill="#1a1025" opacity="0.2"/>
  <path d="M108 48h34c17 0 30 13 30 30v30h-46c-12 0-22 10-22 22v18H98c-17 0-30-13-30-30V78c0-17 13-30 30-30h10z" fill="url(#pythonBlue)"/>
  <circle cx="148" cy="72" r="6" fill="#fff" opacity="0.95"/>
  <rect x="66" y="126" width="82" height="82" rx="28" fill="url(#pythonGold)" filter="url(#glow)"/>
  <circle cx="106" cy="168" r="6" fill="#fff" opacity="0.95"/>
  <path d="M82 168h36c14 0 26 12 26 26v14c0 17-13 30-30 30H90c-17 0-30-13-30-30v-10h42c12 0 22-10 22-22v-8" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  <path d="M168 142h10c17 0 30 13 30 30v18c0 17-13 30-30 30h-8" fill="none" stroke="#ffd86f" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
  <path d="M86 106h28" stroke="#ffd86f" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
  <path d="M150 198h20" stroke="#6f8bff" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
</svg>
